[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foder"
version = "0.2.0"
description = "Local AI coding agent — full developer ecosystem powered by Ollama"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "coding", "agent", "ollama", "local", "terminal", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "prompt_toolkit>=3.0",
    "rich>=13.0",
]

[project.urls]
Homepage   = "https://foder.vercel.app"
Repository = "https://github.com/Frictionalfor/foder"
Issues     = "https://github.com/Frictionalfor/foder/issues"

[project.scripts]
foder = "foder.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["foder*", "skills*"]

[tool.setuptools.package-data]
"foder"  = ["*.md"]
"skills" = ["*.json"]
"*"      = ["install.sh", "install.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test", "t_*"]
